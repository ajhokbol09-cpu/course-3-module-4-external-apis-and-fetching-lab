<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Alerts App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Weather Alerts App</h1>
    <label for="state-input">U.S. state abbreviation</label>
    <div class="search-controls">
      <input type="text" id="state-input" placeholder="Enter state abbreviation" maxlength="2" autocomplete="off">
      <button id="fetch-alerts" type="button">Get Weather Alerts</button>
    </div>
    <div id="loading-spinner" class="hidden" role="status" aria-live="polite">Loading weather alerts...</div>
    <div id="error-message" class="hidden" role="alert"></div>
    <section id="alerts-display" aria-live="polite"></section>
  </main>
  <script src="./index.js"></script>
</body>
</html>
